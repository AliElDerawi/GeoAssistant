name: Kotlin Android CI Workflow

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code (Updated to v4)
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 21 (Updated to v4 & Zulu distribution)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 3: Setup Gradle and Cache (Official GitHub Action for Gradle)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Grant execute permission for Gradlew
      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      # Step 5: Create dummy local.defaults.properties (طريقتك المقتبسة)
      - name: Create dummy local.defaults.properties
        run: echo "MAPS_API_KEY=dummy_value" > local.defaults.properties

      # Step 6: Create google-services.json (طريقتك المقتبسة لفك التشفير)
      - name: Create Google Services JSON File
        env:
           GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -di > app/google-services.json

      # Step 7: Build the project
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Step 8: Run Lint checks
      - name: Run Kotlin Lint
        run: ./gradlew lintDebug

      # Step 9: Run Unit Tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 10: Run Instrumentation Tests (Optional)
      # Uncomment this step if you have instrumentation tests configured
      # - name: Run Instrumented Tests
      #   run: ./gradlew connectedAndroidTest
